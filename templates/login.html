<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Doctors Online Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap");

      body {
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(145deg, #f5f5f7, #e5e5ea);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      /* Logo in top-left corner */
      .logo {
        position: absolute;
        top: 1rem;
        left: 4rem;
        z-index: 10;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        border-radius: 20px;
        background: linear-gradient(145deg, #ffffff, #f2f2f7);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0, 0, 0, 0.05);
        animation: fadeIn 0.5s ease-in-out;
      }

      .login-card h3 {
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
        color: #1d1d1f;
      }

      .form-label {
        font-size: 0.85rem;
        font-weight: 500;
        color: #1d1d1f;
      }

      .form-control {
        background: #f5f5f7;
        border: 1px solid #d2d2d7;
        color: #1d1d1f;
        padding: 0.75rem;
        border-radius: 12px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .form-control:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.3);
        background: #ffffff;
      }

      .btn-apple {
        background: #0071e3;
        border: none;
        border-radius: 12px;
        padding: 0.75rem;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .btn-apple:hover {
        background: #005bb5;
      }

      .btn-apple:active {
        transform: scale(0.98);
      }

      .signup-link {
        text-align: center;
        margin-top: 1rem;
      }

      .signup-link a {
        color: #0071e3;
        text-decoration: none;
        font-weight: 500;
      }

      .signup-link a:hover {
        text-decoration: underline;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 768px) {
        .logo {
          left: 2rem;
        }
      }
      @media (max-width: 480px) {
        .logo {
          left: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Logo in the top-left corner -->
    <div class="logo">
      <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Logo"
        width="160"
      />
    </div>
    <div class="login-card">
      <h3>Login</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" required />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button type="submit" class="btn-apple w-100">Login</button>
      </form>
      <p class="signup-link">
        Don’t have an account? <a href="/signup">Sign Up</a>
      </p>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value.trim();

          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();
          if (response.ok) {
            // Store the JWT token
            localStorage.setItem("access_token", data.access_token);

            window.location.href = "/";
          } else {
            alert(data.error || "Invalid credentials. Please try again.");
          }
        });
    </script>
    <script>
      // Show profile/logout if user is logged in
      const token = localStorage.getItem("access_token");
      const navLinks = document.querySelector(".nav-links");

      if (token) {
        // Remove Login & Signup links
        navLinks
          .querySelectorAll("a[href='/login'], a[href='/signup']")
          .forEach((el) => el.remove());

        // Add Profile link
        const profileLink = document.createElement("a");
        profileLink.href = "/profile";
        profileLink.textContent = "My Profile";
        navLinks.appendChild(profileLink);

        // Add Logout link
        const logoutLink = document.createElement("a");
        logoutLink.href = "#";
        logoutLink.textContent = "Logout";
        logoutLink.addEventListener("click", () => {
          localStorage.removeItem("access_token");
          window.location.reload();
        });
        navLinks.appendChild(logoutLink);
      }
    </script>
  </body>
</html>
