<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Health Assistant | AI in Healthcare</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>AI-Powered Virtual Health Assistant</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/ask">Ask AI</a>
        <a href="/visualize">3D Anatomy</a>
        <a href="/metrics">Health Metrics</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Ask a Health Question</h2>
        <textarea
          id="prompt"
          placeholder="E.g., What are symptoms of hypertension?"
        ></textarea>
        <button onclick="submitPrompt()">Ask AI</button>
        <div id="response"></div>
      </section>
    </main>
    <script src="{{ url_for('static', filename='chat.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='chat.css') }}"
    />
  </body>
</html>
