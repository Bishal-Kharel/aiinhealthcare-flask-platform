<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Health Assistant | AI in Healthcare</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>AI-Powered Virtual Health Assistant</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/ask">Ask AI</a>
        <a href="/visualize">3D Anatomy</a>
        <a href="/metrics">Health Metrics</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Ask a Health Question</h2>
        <textarea
          id="prompt"
          placeholder="E.g., What are symptoms of hypertension?"
        ></textarea>
        <button onclick="submitPrompt()">Ask AI</button>
        <div id="response"></div>
      </section>
      <section>
        <h2>Upload Medical Document</h2>
        <input type="file" id="document" accept=".pdf" />
        <button onclick="uploadDocument()">Upload PDF</button>
      </section>
      <section>
        <h2>Explore Anatomy</h2>
        <canvas id="3d-canvas"></canvas>
      </section>
      <section>
        <h2>Track Health Metrics</h2>
        <input
          type="number"
          id="heart-rate"
          placeholder="Enter heart rate (bpm)"
        />
        <button onclick="addMetric()">Add Metric</button>
        <canvas id="metrics-chart" width="400" height="200"></canvas>
      </section>
    </main>
    <script>
      // Fetch greeting
      fetch("/api/hello")
        .then((r) => r.json())
        .then((d) => (document.getElementById("response").textContent = d.msg));

      //Submitting Promt
      function submitPrompt() {
        const prompt = document.getElementById("prompt").value;

        fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        })
          .then((response) => {
            if (!response.body) {
              throw new Error("ReadableStream not supported in this browser.");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let responseText = "";

            function read() {
              return reader.read().then(({ done, value }) => {
                if (done) {
                  console.log("Stream complete");
                  return;
                }

                // Decode chunk and process SSE data: strip 'data: ' prefix and newlines
                const chunk = decoder.decode(value, { stream: true });
                // SSE messages are sent as: data: <chunk>\n\n
                const lines = chunk
                  .split("\n")
                  .filter((line) => line.startsWith("data: "));
                lines.forEach((line) => {
                  const data = line.replace(/^data: /, "");
                  responseText += data;
                  // Update your UI live here
                  document.getElementById("response").textContent =
                    responseText;
                });

                return read();
              });
            }

            return read();
          })
          .catch((error) => {
            console.error("Error in fetch stream:", error);
          });
      }

      // Upload document
      function uploadDocument() {
        const fileInput = document.getElementById("document");
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        fetch("/api/upload", {
          method: "POST",
          body: formData,
        })
          .then((r) => r.json())
          .then((d) => alert(d.msg));
      }

      // 3D visualization
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, 400 / 300, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("3d-canvas"),
      });
      renderer.setSize(400, 300);
      const loader = new THREE.GLTFLoader();
      loader.load("/static/assets/3d/heart.gltf", (gltf) => {
        scene.add(gltf.scene);
      });
      camera.position.z = 5;
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      // Chart.js for health metrics
      let metrics = [];
      let chart;
      function addMetric() {
        const heartRate = document.getElementById("heart-rate").value;
        if (!heartRate || isNaN(heartRate)) return;
        metrics.push(Number(heartRate));
        const ctx = document.getElementById("metrics-chart").getContext("2d");
        if (chart) chart.destroy(); // Destroy previous chart to avoid overlap
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: metrics.map((_, i) => `Reading ${i + 1}`),
            datasets: [
              {
                label: "Heart Rate (bpm)",
                data: metrics,
                borderColor: "#007bff",
                backgroundColor: "rgba(0, 123, 255, 0.1)",
                fill: true,
              },
            ],
          },
          options: {
            scales: {
              y: { beginAtZero: true, title: { display: true, text: "BPM" } },
              x: { title: { display: true, text: "Measurement" } },
            },
          },
        });
      }
    </script>
  </body>
</html>
