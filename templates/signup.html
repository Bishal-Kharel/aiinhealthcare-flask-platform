<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - Doctors Online Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap");

      body {
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(145deg, #f5f5f7, #e5e5ea);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        position: relative;
      }

      /* Logo in top-left corner */
      .logo {
        position: absolute;
        top: 1rem;
        left: 4rem;
        z-index: 10;
      }

      /* Signup card */
      .signup-card {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        border-radius: 20px;
        background: linear-gradient(145deg, #ffffff, #f2f2f7);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0, 0, 0, 0.05);
        animation: fadeIn 0.5s ease-in-out;
      }

      .signup-card h3 {
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
        color: #1d1d1f;
      }

      .form-label {
        font-size: 0.85rem;
        font-weight: 500;
        color: #1d1d1f;
      }

      .form-control {
        background: #f5f5f7;
        border: 1px solid #d2d2d7;
        color: #1d1d1f;
        padding: 0.75rem;
        border-radius: 12px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .form-control:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.3);
        background: #ffffff;
      }

      .btn-apple {
        background: #0071e3;
        border: none;
        border-radius: 12px;
        padding: 0.75rem;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .btn-apple:hover {
        background: #005bb5;
      }

      .btn-apple:active {
        transform: scale(0.98);
      }

      .login-link {
        text-align: center;
        margin-top: 1rem;
      }

      .login-link a {
        color: #0071e3;
        text-decoration: none;
        font-weight: 500;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 768px) {
        .logo {
          left: 2rem;
        }
      }
      @media (max-width: 480px) {
        .logo {
          left: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Logo in the top-left corner -->
    <div class="logo">
      <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        alt="Logo"
        width="160"
      />
    </div>

    <!-- Signup Card -->
    <div class="signup-card">
      <h3>Create Your Account</h3>
      <form id="signupForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button type="submit" class="btn-apple w-100">Sign Up</button>
      </form>
      <p class="login-link">
        Already have an account? <a href="/login">Login</a>
      </p>
    </div>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();

          const response = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });

          const data = await response.json();
          if (response.ok) {
            const loginResp = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            const loginData = await loginResp.json();
            if (loginResp.ok) {
              localStorage.setItem("access_token", loginData.access_token);
              window.location.href = "/"; // redirect to home
            } else {
              alert(
                "Signup succeeded but login failed. Please login manually."
              );
              window.location.href = "/login";
            }
          } else {
            alert(data.error || "An error occurred. Please try again.");
          }
        });
    </script>
  </body>
</html>
